name: ظ†ط´ط± ط§ظ„ط¨ط§ظƒ ط§ظ†ط¯ ط¥ظ„ظ‰ Azure

# ظٹظ†ط´ط± طھظ„ظ‚ط§ط¦ظٹط§ظ‹ ط¹ظ†ط¯ ط£ظٹ push ط¹ظ„ظ‰ main ظٹظ…ط³ظ‘ ظ…ط¬ظ„ط¯ Backend ظپظ‚ط·.
# (طھط¹ط¯ظٹظ„ط§طھ ط§ظ„ظˆط§ط¬ظ‡ط© ظˆط­ط¯ظ‡ط§ ظ„ط§ طھظڈط´ط؛ظ‘ظ„ ظ‡ط°ط§ â€” Cloudflare Pages ظٹطھظƒظپظ‘ظ„ ط¨ظ‡ط§.)
on:
  push:
    branches: [ main ]
    paths:
      - 'Backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:        # ظٹطھظٹط­ ط§ظ„طھط´ط؛ظٹظ„ ط§ظ„ظٹط¯ظˆظٹ ظ…ظ† طھط¨ظˆظٹط¨ Actions

jobs:
  deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: playrush_test
          POSTGRES_PASSWORD: local_ci
          POSTGRES_DB: playrush_test
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 12
      redis:
        image: redis:7
        ports: ["6379:6379"]

    steps:
      - name: ط¬ظ„ط¨ ط§ظ„ظƒظˆط¯
        uses: actions/checkout@v4

      - name: Setup Python for content regression checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run backend regression suite before deployment
        working-directory: Backend
        env:
          SECRET_KEY: disposable-ci-key-for-isolated-tests-only-12345
          DATABASE_URL: postgresql://playrush_test:local_ci@127.0.0.1:5432/playrush_test
          PLAYRUSH_TEST_POSTGRES: "1"
          PLAYRUSH_TEST_REDIS: redis://127.0.0.1:6379/15
          PYTHON_DOTENV_DISABLED: "1"
        run: |
          python -m pip install -r requirements.txt
          python -m unittest discover -s tests -v
          PYTHONPATH=. python -m unittest discover -s tests/integration -v

      - name: ط§ظ„ظ†ط´ط± ط¥ظ„ظ‰ Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: playrush-server
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./Backend

