name: نشر الباك اند إلى Azure

# ينشر تلقائياً عند أي push على main يمسّ مجلد Backend فقط.
# (تعديلات الواجهة وحدها لا تُشغّل هذا — Cloudflare Pages يتكفّل بها.)
on:
  push:
    branches: [ main ]
    paths:
      - 'Backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:        # يتيح التشغيل اليدوي من تبويب Actions

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: جلب الكود
        uses: actions/checkout@v4

      - name: النشر إلى Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: playrush-api
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./Backend
