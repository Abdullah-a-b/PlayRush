<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PlayRush">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <script src="js/pwa.js" defer></script>
  <title>تسجيل الدخول</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/brand.css">
    <link rel="stylesheet" href="css/social_bar.css">
    <script src="js/ui_dialog.js"></script>
    <script src="js/brand.js" defer></script>
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/app_perf.css">
</head>
<body>
  <a href="index.html" id="backHomeBtn"
     onclick="try{sessionStorage.setItem('pr_splash_company','1')}catch(e){}"
     style="position:fixed;top:16px;inset-inline-start:16px;z-index:1000;display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:12px;background:rgba(22,27,34,.85);border:1px solid rgba(255,255,255,.15);color:#c9d1d9;text-decoration:none;font-size:.88rem;font-weight:700;">
    <span>🏠</span> الرئيسية
  </a>

  <div class="stars" id="stars"></div>

  <div class="login-container">
    <h2>تسجيل الدخول</h2>
    <form id="loginForm">
      <div class="input-group">
        <i class="icon fa fa-envelope"></i>
        <input type="email" id="email" name="email" required />
        <label for="email">البريد الإلكتروني</label>
      </div>

      <div class="input-group">
        <i class="icon fa fa-lock"></i>
        <input type="password" id="password" name="password" required />
        <label for="password">كلمة المرور</label>
        <i class="fa fa-eye toggle-password" id="togglePassword"></i>
      </div>

      <label class="remember-me" style="display:flex;align-items:center;gap:8px;margin:6px 0 12px;cursor:pointer;font-size:.92rem;opacity:.9;">
        <input type="checkbox" id="rememberMe" checked style="width:16px;height:16px;accent-color:#facc15;cursor:pointer;" />
        تذكرني لمدة أسبوع
      </label>
      <button type="submit">دخول</button>
    </form>
    
    <div class="links-group">
      <p>ليس لديك حساب؟ <a href="register.html">إنشاء حساب</a></p>
      <p style="margin-top: 10px;"><a href="forgot-password.html">نسيت كلمة المرور؟</a></p>
    </div>

    <hr>
    <a href="#" id="google-login-btn" style="text-decoration: none;">
      <button class="google-btn">
        <i class="fab fa-google" style="margin-left: 8px;"></i> الدخول بواسطة Google
      </button>
    </a>

    <div class="message" id="loginMessage" style="text-align: center; margin-top: 15px;"></div>
  </div>

  <script src="js/config.js" defer></script>
  <script src="js/google_auth.js" defer></script>
    <script src="js/social_bar.js" defer></script>
  <script src="js/emoji_engine.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="js/login.js" defer></script>
  <script src="js/anti_cheat.js" defer></script>
  <script src="js/sound.js" defer></script>
  <div class="pr-copyright" style="text-align:center;padding:14px 8px;font-size:.78rem;opacity:.55;">
    © 2026 <strong>Isolated Person</strong> — PlayRush™ جميع الحقوق محفوظة &nbsp;·&nbsp; <a href="terms.html" target="_blank" rel="noopener" style="color:inherit;">الشروط والأحكام</a>
  </div>
  <script src="js/music.js" defer></script>
</body>
</html>
