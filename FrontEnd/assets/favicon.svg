<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.5" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <filter id="glowGold" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glowPink" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#bg)"/>

  <!-- نجوم الهوية: ذهبية وبنفسجية متوهجة كما في صفحة index -->
  <circle cx="12" cy="12" r="1.6" fill="#ffeb3b" opacity="0.9"/>
  <circle cx="52" cy="9"  r="1.2" fill="#6a1b9a" opacity="0.95"/>
  <circle cx="57" cy="26" r="1.4" fill="#ffeb3b" opacity="0.8"/>
  <circle cx="8"  cy="34" r="1.1" fill="#6a1b9a" opacity="0.9"/>
  <circle cx="18" cy="55" r="1.3" fill="#ffeb3b" opacity="0.75"/>
  <circle cx="50" cy="52" r="1.5" fill="#6a1b9a" opacity="0.85"/>
  <circle cx="33" cy="7"  r="0.9" fill="#ffeb3b" opacity="0.6"/>

  <!-- PR بألوان شعار المنصة: P ذهبية وR وردية مائلة -->
  <text x="19" y="45" font-family="Tajawal, Arial, sans-serif"
        font-size="34" font-weight="900" text-anchor="middle"
        fill="#facc15" filter="url(#glowGold)">P</text>
  <text x="42" y="45" font-family="Tajawal, Arial, sans-serif"
        font-size="34" font-weight="900" font-style="italic" text-anchor="middle"
        fill="#f43f5e" filter="url(#glowPink)">R</text>
</svg>
