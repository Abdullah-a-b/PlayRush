<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>الحساب محظور - PlayRush</title>
  <link rel="stylesheet" href="css/login.css" />
  <link rel="stylesheet" href="css/all.min.css">
  <link rel="stylesheet" href="css/brand.css">
  <script src="js/brand.js" defer></script>
  <style>
    .ban-container {
      max-width: 480px;
      margin: 8vh auto;
      background: rgba(20, 20, 35, 0.85);
      border: 1px solid rgba(244, 67, 54, 0.3);
      border-radius: 18px;
      padding: 40px 30px;
      text-align: center;
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
      backdrop-filter: blur(8px);
    }
    .ban-icon {
      font-size: 64px;
      color: #f44336;
      margin-bottom: 20px;
      animation: banPulse 2s ease-in-out infinite;
    }
    @keyframes banPulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.08); opacity: 0.85; }
    }
    .ban-container h1 { color: #fff; font-size: 1.6rem; margin-bottom: 12px; }
    .ban-reason {
      color: #ddd; font-size: 1rem; line-height: 1.7;
      background: rgba(244, 67, 54, 0.08);
      border-radius: 10px; padding: 16px; margin: 20px 0;
    }
    .ban-help { color: #aaa; font-size: 0.9rem; margin-bottom: 24px; }
    .ban-actions { display: flex; flex-direction: column; gap: 12px; }
    .ban-btn {
      padding: 13px; border-radius: 10px; border: none;
      font-size: 1rem; cursor: pointer; font-family: inherit;
      transition: transform 0.15s, filter 0.15s; text-decoration: none;
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    }
    .ban-btn:hover { transform: translateY(-2px); filter: brightness(1.1); }
    .ban-btn.primary { background: linear-gradient(135deg, #667eea, #764ba2); color: #fff; }
    .ban-btn.secondary { background: rgba(255,255,255,0.08); color: #ddd; border: 1px solid rgba(255,255,255,0.15); }
  </style>
</head>
<body>
  <div class="stars" id="stars"></div>

  <div class="ban-container">
    <div class="ban-icon"><i class="fa-solid fa-ban"></i></div>
    <h1>تم تقييد حسابك</h1>

    <div class="ban-reason" id="banReason">
      تم تقييد حسابك بسبب مخالفة سياسات اللعب العادل والأمان في PlayRush.
    </div>

    <p class="ban-help">
      إذا كنت تعتقد أن هذا خطأ، يمكنك التواصل مع الدعم لمراجعة حالتك.
    </p>

    <div class="ban-actions">
      <a href="mailto:playrush.online@gmail.com?subject=مراجعة حظر حساب" class="ban-btn primary">
        <i class="fa-solid fa-headset"></i> التواصل مع الدعم
      </a>
      <a href="login.html" class="ban-btn secondary">
        <i class="fa-solid fa-house"></i> العودة للرئيسية
      </a>
    </div>
  </div>

  <script>
    // نعرض سبب الحظر لو مُرّر عبر الرابط (?reason=...) أو sessionStorage
    (function() {
      try {
        const params = new URLSearchParams(location.search);
        const reason = params.get('reason') || sessionStorage.getItem('banReason');
        if (reason) {
          document.getElementById('banReason').textContent = decodeURIComponent(reason);
        }
        // ننظّف أي توكن (الحساب محظور)
        sessionStorage.removeItem('token');
      } catch (e) {}
    })();
  </script>
</body>
</html>
