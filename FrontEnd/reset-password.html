<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PlayRush">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <script src="js/pwa.js" defer></script>
  <title>تعيين كلمة المرور</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/brand.css">
    <link rel="stylesheet" href="css/social_bar.css">
    <script src="js/ui_dialog.js"></script>
    <script src="js/brand.js" defer></script>
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div class="stars" id="stars"></div>

  <div class="reset-container">
    <h2>كلمة مرور جديدة</h2>
    
    <form id="resetPasswordForm">
      <div class="input-group">
        <i class="icon fa fa-lock"></i>
        <input type="password" id="password" name="password" required />
        <label for="password">كلمة المرور الجديدة</label>
        <i class="fa fa-eye toggle-password" id="togglePassword"></i>
      </div>
      <div class="input-group">
        <i class="icon fa fa-repeat"></i>
        <input type="password" id="confirmPassword" name="confirmPassword" required />
        <label for="confirmPassword">تأكيد كلمة المرور</label>
        <i class="fa fa-eye toggle-password" id="toggleConfirmPassword"></i>
      </div>
      
      <button type="submit">حفظ التغييرات</button>

      <div class="message" id="resetMessage" style="text-align: center; margin-top: 15px;"></div>
    </form>
  </div>

  <script src="js/config.js" defer></script>
    <script src="js/social_bar.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="js/reset-password.js" defer></script>
  <script src="js/anti_cheat.js" defer></script>
  <script src="js/sound.js" defer></script>
  <script src="js/music.js" defer></script>
</body>
</html>
