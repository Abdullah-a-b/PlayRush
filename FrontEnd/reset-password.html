<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <title>تعيين كلمة المرور - PlayRush</title>
  <link rel="stylesheet" href="css/reset-password.css" />
  <link rel="stylesheet" href="css/all.min.css">
</head>
<body>
  <div class="stars" id="stars"></div>

  <div class="reset-container">
    <h2>كلمة مرور جديدة</h2>
    
    <form id="resetPasswordForm">
      <div class="input-group">
        <i class="icon fa fa-lock"></i>
        <input type="password" id="password" name="password" required />
        <label for="password">كلمة المرور الجديدة</label>
        <i class="fa fa-eye toggle-password" id="togglePassword"></i>
      </div>
      <div class="input-group">
        <i class="icon fa fa-repeat"></i>
        <input type="password" id="confirmPassword" name="confirmPassword" required />
        <label for="confirmPassword">تأكيد كلمة المرور</label>
        <i class="fa fa-eye toggle-password" id="toggleConfirmPassword"></i>
      </div>
      
      <button type="submit">حفظ التغييرات</button>

      <div class="message" id="resetMessage" style="text-align: center; margin-top: 15px;"></div>
    </form>
  </div>

  <script src="js/config.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="js/reset-password.js" defer></script>
  <script src="js/anti_cheat.js" defer></script>
</body>
</html>
