<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PlayRush">
    <link rel="apple-touch-icon" href="assets/icons/icon-192.png">
    <script src="js/pwa.js" defer></script>
  <title>نسيت كلمة المرور</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/auth.css" />
  <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/brand.css">
    <link rel="stylesheet" href="css/social_bar.css">
    <script src="js/ui_dialog.js"></script>
    <script src="js/brand.js" defer></script>
  <link rel="stylesheet" href="css/responsive.css">
  <link rel="stylesheet" href="css/app_perf.css">
</head>
<body>
  <div class="stars" id="stars"></div>

  <div class="forgot-container">
    <h2>استعادة كلمة المرور</h2>
    <p style="text-align: center; color: #cbd5e1; font-size: 14px; margin-bottom: 25px;">
      أدخل بريدك الإلكتروني وسنرسل لك رمز التحقق
    </p>

    <form id="forgotPasswordForm">
      <div class="input-group">
        <i class="icon fa fa-envelope"></i>
        <input type="email" id="email" name="email" required />
        <label for="email">البريد الإلكتروني</label>
      </div>
      <button type="submit">إرسال رمز التحقق</button>
    </form>
    
    <div class="links-group">
      <p><a href="login.html">العودة لتسجيل الدخول</a></p>
    </div>

    <div class="message" id="messageBox" style="text-align: center; margin-top: 15px;"></div>
  </div>

  <script src="js/config.js" defer></script>
    <script src="js/social_bar.js" defer></script>
  <script src="js/emoji_engine.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="js/forgot-password.js" defer></script>
  <script src="js/anti_cheat.js" defer></script>
  <script src="js/sound.js" defer></script>
  <script src="js/music.js" defer></script>
</body>
</html>
