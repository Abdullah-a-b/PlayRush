<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <title>نسيت كلمة المرور - PlayRush</title>
  <link rel="stylesheet" href="css/forgot-password.css" />
  <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/brand.css">
    <script src="js/brand.js" defer></script>
</head>
<body>
  <div class="stars" id="stars"></div>

  <div class="forgot-container">
    <h2>استعادة كلمة المرور</h2>
    <p style="text-align: center; color: #cbd5e1; font-size: 14px; margin-bottom: 25px;">
      أدخل بريدك الإلكتروني وسنرسل لك رمز التحقق
    </p>

    <form id="forgotPasswordForm">
      <div class="input-group">
        <i class="icon fa fa-envelope"></i>
        <input type="email" id="email" name="email" required />
        <label for="email">البريد الإلكتروني</label>
      </div>
      <button type="submit">إرسال رمز التحقق</button>
    </form>
    
    <div class="links-group">
      <p><a href="login.html">العودة لتسجيل الدخول</a></p>
    </div>

    <div class="message" id="messageBox" style="text-align: center; margin-top: 15px;"></div>
  </div>

  <script src="js/config.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="js/forgot-password.js" defer></script>
  <script src="js/anti_cheat.js" defer></script>
</body>
</html>
