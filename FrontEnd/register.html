<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>إنشاء حساب - PlayRush</title>
  <link rel="stylesheet" href="css/register.css" />
  <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/brand.css">
    <link rel="stylesheet" href="css/social_bar.css">
    <script src="js/brand.js" defer></script>
</head>
<body>
  <div class="stars" id="stars"></div>

  <div class="register-form">
    <h2>إنشاء حساب جديد</h2>
    
    <form id="registerForm">
      <div class="input-group">
        <i class="icon fa fa-envelope"></i>
        <input type="email" id="email" name="email" required />
        <label for="email">البريد الإلكتروني</label>
      </div>

      <div class="input-group">
        <i class="icon fa fa-lock"></i>
        <input type="password" id="password" name="password" required />
        <label for="password">كلمة المرور</label>
        <i class="fa fa-eye toggle-password" id="togglePassword"></i>
      </div>

      <div class="input-group">
        <i class="icon fa fa-repeat"></i>
        <input type="password" id="confirmPassword" name="confirmPassword" required />
        <label for="confirmPassword">تأكيد كلمة المرور</label>
        <i class="fa fa-eye toggle-password" id="toggleConfirmPassword"></i>
      </div>

      <div class="terms-group">
        <input type="checkbox" id="terms" required>
        <label for="terms">أوافق على <a href="terms.html" target="_blank">شروط وأحكام</a> PlayRush</label>
      </div>

      <button type="submit">تسجيل حساب</button>
    </form>

    <p class="login-link">
      لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a>
    </p>
  
    <hr>
    <a href="#" id="google-login-btn" style="text-decoration: none;">
        <button class="google-btn">
          <i class="fab fa-google" style="margin-left: 8px;"></i> التسجيل بواسطة Google
        </button>
    </a>
  </div>

  <script src="js/config.js" defer></script>
    <script src="js/social_bar.js" defer></script>
  <script src="js/utils.js" defer></script>
  <script src="js/register.js" defer></script>
  <script src="js/anti_cheat.js" defer></script>
</body>
</html>
