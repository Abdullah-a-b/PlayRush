# ==========================================
# pg_hba.conf — Primary (VPS 1)
# ==========================================
# المسار: /etc/postgresql/15/main/pg_hba.conf
#
# 🛡️ التحكم في من يقدر يتصل ومن أي IP
# scram-sha-256 = أقوى نوع authentication

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# الاتصال المحلي (السيرفر نفسه)
local   all             postgres                                peer
local   all             all                                     scram-sha-256

# الـ app يتصل من نفس السيرفر
host    playrush_db     playrush_app    127.0.0.1/32           scram-sha-256
host    playrush_db     playrush_app    ::1/128                scram-sha-256

# ⚠️ استبدل <STANDBY_IP> بـ IP الحقيقي للـ VPS 2
# الـ standby يتصل لـ replication
host    replication     replicator      <STANDBY_IP>/32        scram-sha-256

# ⚠️ لو الـ app يتصل من VPS منفصل، أضف:
# host    playrush_db     playrush_app    <APP_VPS_IP>/32       scram-sha-256

# 🚫 لا تضف "host all all 0.0.0.0/0" — هذا يفتح DB للعالم
