# ==========================================
# postgresql.conf — Primary (VPS 1)
# ==========================================
# المسار: /etc/postgresql/15/main/postgresql.conf
# نسخ هذه السطور (أو عدّل القيم الموجودة)
#
# بعد التعديل: sudo systemctl restart postgresql

# ==========================================
# Connection
# ==========================================
listen_addresses = '*'              # يستمع لكل الـ network interfaces
                                    # ⚠️ تأكد من firewall! (UFW أو iptables)
port = 5432
max_connections = 100               # كافي لـ 4 workers × 20 = 80 + buffer

# ==========================================
# WAL (Write-Ahead Logging) — مطلوب للـ replication
# ==========================================
wal_level = replica                 # يبث WAL يكفي للـ standby
max_wal_senders = 5                 # عدد الـ standbys المسموحة
max_replication_slots = 5
wal_keep_size = 1GB                 # ✨ يحتفظ بـ 1GB من WAL في حال standby بطيء
                                    # (تجنب الحاجة لـ archive_command معقد)

# ==========================================
# Archive (للـ point-in-time recovery — اختياري لكن منصوح به)
# ==========================================
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'
# ⚠️ تأكد من إنشاء المجلد:
# sudo mkdir -p /var/lib/postgresql/wal_archive
# sudo chown postgres:postgres /var/lib/postgresql/wal_archive

# ==========================================
# الأداء (لـ VPS متوسط 4 GB RAM)
# ==========================================
shared_buffers = 1GB                # 25% من RAM
effective_cache_size = 3GB          # 75% من RAM
maintenance_work_mem = 256MB
work_mem = 16MB
random_page_cost = 1.1              # SSD (لو HDD اجعلها 4.0)
effective_io_concurrency = 200      # SSD

# ==========================================
# Checkpoints
# ==========================================
checkpoint_completion_target = 0.9
checkpoint_timeout = 15min
max_wal_size = 2GB
min_wal_size = 80MB

# ==========================================
# Logging (للتشخيص)
# ==========================================
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 1000   # سجّل أي query > 1 ثانية
log_checkpoints = on
log_connections = off
log_disconnections = off
log_line_prefix = '%t [%p]: [%l-1] db=%d,user=%u '
log_lock_waits = on
log_statement = 'ddl'               # سجّل CREATE/ALTER/DROP فقط

# ==========================================
# Auto vacuum (مهم للأداء)
# ==========================================
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 1min

# ==========================================
# Statement timeout (يمنع query عالقة)
# ==========================================
statement_timeout = 30000           # 30 ثانية لأي query
idle_in_transaction_session_timeout = 60000  # دقيقة
