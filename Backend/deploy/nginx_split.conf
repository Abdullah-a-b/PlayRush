# 🔀 تقسيم المسارات (المرحلة ب-1) — قبل هجرة الغرف لـ Redis (ب-2):
#   /socket.io → worker واحد (8001) يحمل كل حالة الغرف
#   /api/      → عدة workers (8002+) لطلبات HTTP (auth, stats, shop...)
# التشغيل:
#   PORT=8001 python run_prod.py                      # سوكيت
#   PORT=8002 WORKERS=4 REDIS_URL=... python run_prod.py  # API
upstream socket_worker { server 127.0.0.1:8001; }
upstream api_workers   { server 127.0.0.1:8002; }

server {
    listen 80;
    server_name _;

    location /socket.io/ {
        proxy_pass http://socket_worker;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location /api/ {
        proxy_pass http://api_workers;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        proxy_pass http://socket_worker;   # static/frontend لو يخدمها التطبيق
        proxy_set_header Host $host;
    }
}
